<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | OmniSV</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
</head>
<body class="admin-body">
    
    <!-- ========================================== -->
    <!-- PANTALLA DE LOGIN                          -->
    <!-- ========================================== -->
    <div id="pantallaLogin">
        <div class="login-container">
            <div class="login-header">
                <h2>OmniSV</h2>
                <p>Panel de Administración</p>
            </div>
            <form id="formLogin">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingrese usuario" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingrese contraseña" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
            <p id="errorLogin" class="error-message">❌ Credenciales incorrectas</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PANEL DE ADMINISTRACIÓN                   -->
    <!-- ========================================== -->
    <div id="panelAdmin" style="display:none;">
        <header class="admin-header">
            <h1>OmniSV Admin</h1>
            <button id="btnCerrarSesion" class="btn-cerrar">Cerrar Sesión</button>
        </header>

        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="productos">📦 Productos</button>
            <button class="tab-btn" data-tab="terminos">📋 Términos y Condiciones</button>
        </div>

        <!-- Sección Productos -->
        <div id="seccionProductos" class="tab-content active">
            <div class="admin-grid">
                <!-- Formulario para agregar -->
                <div class="form-container">
                    <h2>Agregar Producto</h2>
                    <form id="formProducto">
                        <div class="form-group">
                            <label for="nombre">Nombre del producto *</label>
                            <input type="text" id="nombre" placeholder="Ej: Zapatilla Deportiva Aero" required>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="precio">Precio *</label>
                                <input type="number" id="precio" placeholder="0.00" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label for="categoria">Categoría *</label>
                                <select id="categoria" required>
                                    <option value="">Seleccionar</option>
                                    <option value="dama">Dama</option>
                                    <option value="belleza">Belleza</option>
                                    <option value="tecnologia">Tecnología</option>
                                    <option value="cocina">Cocina</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="descripcion">Descripción</label>
                            <textarea id="descripcion" placeholder="Describe el producto..." rows="4"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>📸 URLs de las fotos *</label>
                            <div id="contenedorUrls">
                                <div class="url-entry">
                                    <input type="url" class="url-foto" placeholder="https://ejemplo.com/foto1.jpg" required>
                                    <button type="button" class="btn-eliminar-url" title="Eliminar">✕</button>
                                </div>
                            </div>
                            <button type="button" id="btnAgregarUrl" class="btn-agregar">+ Agregar otra foto</button>
                        </div>
                        
                        <button type="submit" class="btn-guardar">💾 Guardar Producto</button>
                    </form>
                </div>

                <!-- Lista de productos existentes -->
                <div class="lista-container">
                    <h2>Productos Existentes</h2>
                    <div id="listaProductosAdmin">
                        <p>Cargando productos...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección Términos -->
        <div id="seccionTerminos" class="tab-content">
            <h2>Editar Términos y Condiciones</h2>
            <p class="info-text">Estos términos se mostrarán al final del catálogo público.</p>
            <textarea id="terminosTexto" rows="10" placeholder="Escribe los términos y condiciones aquí..."></textarea>
            <button id="btnGuardarTerminos" class="btn-guardar">💾 Guardar Términos</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
